<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-light">
<div class="container py-4">
    {% include "_nav.html" %}

    {% if risultato %}
    <div class="alert alert-success">{{ risultato }}</div>
    {% endif %}

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h2 class="h5 mb-3">Filtra destinatari</h2>
            <form method="post" action="/comunicazioni">
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label" for="fascia">Fascia</label>
                        <select class="form-select" id="fascia" name="fascia">
                            <option value="" {% if not filtri.fascia %}selected{% endif %}>Tutte</option>
                            {% for opzione in ["Generale", "Uninord", "Unisud"] %}
                            <option value="{{ opzione }}" {% if filtri.fascia == opzione %}selected{% endif %}>{{ opzione }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="stato_iscrizione">Stato iscrizione</label>
                        <select class="form-select" id="stato_iscrizione" name="stato_iscrizione">
                            <option value="" {% if not filtri.stato_iscrizione %}selected{% endif %}>Tutti</option>
                            {% for opzione in ["Inviata", "Calcolata", "Confermata", "Annullata"] %}
                            <option value="{{ opzione }}" {% if filtri.stato_iscrizione == opzione %}selected{% endif %}>{{ opzione }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="tipo_evento">Evento</label>
                        <select class="form-select" id="tipo_evento" name="tipo_evento">
                            <option value="" {% if not filtri.tipo_evento %}selected{% endif %}>Tutti</option>
                            {% for valore, etichetta in TIPI_EVENTO_LABELS.items() %}
                            <option value="{{ valore }}" {% if filtri.tipo_evento == valore %}selected{% endif %}>{{ etichetta }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="zona_provenienza">Zona di provenienza</label>
                        <input type="text" class="form-control" id="zona_provenienza" name="zona_provenienza"
                               placeholder="es. Sassari" value="{{ filtri.zona_provenienza or '' }}">
                    </div>
                </div>

                <button type="submit" name="azione" value="anteprima" class="btn btn-outline-secondary mb-3">
                    Aggiorna anteprima
                </button>

                <div class="alert alert-info">
                    Destinatari corrispondenti ai filtri: <strong>{{ numero_destinatari }}</strong>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="oggetto">Oggetto</label>
                    <input type="text" class="form-control" id="oggetto" name="oggetto" value="{{ oggetto or '' }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="testo_libero">Messaggio</label>
                    <textarea class="form-control" id="testo_libero" name="testo_libero" rows="8" required>{{ testo_libero or '' }}</textarea>
                    <div class="form-text">Separa i paragrafi con una riga vuota.</div>
                </div>

                <button type="submit" name="azione" value="invia" class="btn btn-primary"
                        onclick="return confirm('Inviare l\'email a {{ numero_destinatari }} destinatari?');">
                    Invia email di massa
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
