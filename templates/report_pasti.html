<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-light">
<div class="container py-4">
    {% include "_nav.html" %}

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Report pasti per giorno</h2>
                <a href="/report-pasti/csv" class="btn btn-outline-secondary btn-sm">Esporta CSV</a>
            </div>

            {% if not righe %}
            <p class="text-muted mb-0">Nessun partecipante attivo con date valide al momento.</p>
            {% else %}
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Colazioni</th>
                        <th>Pranzi</th>
                        <th>Cene</th>
                    </tr>
                </thead>
                <tbody>
                    {% for riga in righe %}
                    <tr>
                        <td>{{ riga.data }}</td>
                        <td>{{ riga.colazioni }}</td>
                        <td>{{ riga.pranzi }}</td>
                        <td>{{ riga.cene }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
