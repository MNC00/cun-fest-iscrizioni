<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body class="bg-light">
{% include "_nav_pubblica.html" %}
<div class="container py-5">
    <h1 class="mb-4">{{ title }}</h1>

    <div id="alert-box"></div>

    <form id="form-iscrizione" novalidate>
        <!-- Tipo di iscrizione -->
        <div class="card mb-4">
            <div class="card-header fw-bold">Tipo di iscrizione</div>
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo_iscrizione" id="tipo-singola" value="singola" checked>
                    <label class="form-check-label" for="tipo-singola">Iscrizione singola (una sola persona)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo_iscrizione" id="tipo-famiglia" value="famiglia">
                    <label class="form-check-label" for="tipo-famiglia">Nucleo familiare (più persone)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="tipo_iscrizione" id="tipo-estensione" value="estensione">
                    <label class="form-check-label" for="tipo-estensione">Aggiungi persone a un nucleo già iscritto</label>
                </div>
            </div>
        </div>

        <!-- Sezione Referente -->
        <div class="card mb-4">
            <div class="card-header fw-bold" id="titolo-sezione-referente">Referente famiglia</div>
            <div class="card-body">
                <p class="text-muted small" id="sottotitolo-sezione-referente"></p>
                <div class="row g-3">
                    <div class="col-md-6 campo-referente-nome">
                        <label class="form-label">Nome</label>
                        <input type="text" class="form-control" name="referente_nome">
                    </div>
                    <div class="col-md-6 campo-referente-nome">
                        <label class="form-label">Cognome</label>
                        <input type="text" class="form-control" name="referente_cognome">
                    </div>
                    <div class="col-md-6 campo-referente-contatto">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="referente_email" required>
                    </div>
                    <div class="col-md-6 campo-referente-contatto">
                        <label class="form-label">Telefono</label>
                        <input type="tel" class="form-control" name="referente_telefono">
                    </div>
                    <div class="col-md-6 d-none campo-famiglia-esistente">
                        <label class="form-label">Email del nucleo già iscritto</label>
                        <input type="email" class="form-control" name="famiglia_esistente_email">
                        <div class="form-text">Inserisci l'email usata per la prima iscrizione della famiglia.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sezione Partecipanti -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold" id="titolo-sezione-partecipanti">Partecipanti</span>
                <button type="button" class="btn btn-sm btn-primary" id="btn-aggiungi-partecipante">
                    + Aggiungi partecipante
                </button>
            </div>
            <div class="card-body">
                <div id="partecipanti-container"></div>
                <p class="text-muted small mb-0" id="nessun-partecipante-msg">
                    Nessun partecipante aggiunto. Clicca su "Aggiungi partecipante".
                </p>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg">Invia iscrizione</button>
    </form>
</div>

<!-- Template per un blocco partecipante (clonato via JS) -->
<template id="template-partecipante">
    <div class="partecipante-block border rounded p-3 mb-3 position-relative">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-2 btn-rimuovi-partecipante"
                aria-label="Rimuovi partecipante"></button>
        <h6 class="mb-3">Partecipante <span class="partecipante-index"></span></h6>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" data-field="nome" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Cognome</label>
                <input type="text" class="form-control" data-field="cognome" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Data di nascita</label>
                <input type="date" class="form-control" data-field="data_nascita">
            </div>
            <div class="col-md-4">
                <label class="form-label">Luogo di nascita</label>
                <input type="text" class="form-control" data-field="luogo_nascita">
            </div>
            <div class="col-md-4">
                <label class="form-label">Zona di provenienza</label>
                <select class="form-select" data-field="zona_provenienza">
                    <option value="" selected disabled>Seleziona...</option>
                    <option value="Nord">Nord</option>
                    <option value="Centro">Centro</option>
                    <option value="Sud">Sud</option>
                </select>
            </div>
            <div class="col-md-12">
                <label class="form-label d-block">Tipo di iscrizione a questo evento</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="modalita-ISCRIZIONE" data-field="modalita_iscrizione" value="normale" id="modalita-normale-CHECK" checked>
                    <label class="form-check-label" for="modalita-normale-CHECK">Iscrizione normale</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="modalita-ISCRIZIONE" data-field="modalita_iscrizione" value="pranzo_cun" id="modalita-pranzo-CHECK">
                    <label class="form-check-label" for="modalita-pranzo-CHECK">Solo pranzo CUN</label>
                </div>
            </div>
            <div class="col-12 blocco-eventi-normali">
                <label class="form-label d-block">A quali eventi partecipi?</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" data-field="flag_precun" id="precun-CHECK">
                    <label class="form-check-label" for="precun-CHECK">PreCunFest</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" data-field="flag_campo_famiglie" id="campo-famiglie-CHECK">
                    <label class="form-check-label" for="campo-famiglie-CHECK">Campo Famiglie</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" data-field="flag_cun_fest" id="cun-fest-CHECK">
                    <label class="form-check-label" for="cun-fest-CHECK">CunFest</label>
                </div>
                <div class="form-text">
                    PreCunFest e Campo Famiglie si svolgono in contemporanea: seleziona solo uno dei due
                    (puoi comunque abbinare CunFest a uno di essi, oppure iscriverti solo a CunFest).
                </div>
            </div>
            <div class="col-md-6 blocco-eventi-normali">
                <label class="form-label">Data arrivo</label>
                <input type="date" class="form-control" data-field="data_arrivo">
            </div>
            <div class="col-md-6 blocco-eventi-normali">
                <label class="form-label">Data partenza</label>
                <input type="date" class="form-control" data-field="data_partenza">
            </div>
            <div class="col-12 blocco-eventi-normali">
                <div class="form-text nota-date-evento text-muted"></div>
            </div>
            <div class="col-md-6 campo-pasto blocco-eventi-normali">
                <label class="form-label">Pasto arrivo</label>
                <select class="form-select" data-field="pasto_arrivo">
                    <option value="nessuno">Nessuno</option>
                    <option value="colazione">Colazione</option>
                    <option value="pranzo">Pranzo</option>
                    <option value="cena">Cena</option>
                    <option value="dopo_cena">Dopo cena</option>
                </select>
                <div class="form-text">Da quale pasto vi presentate il giorno di arrivo (o "Dopo cena" se arrivate a cena già conclusa).</div>
            </div>
            <div class="col-md-6 campo-pasto blocco-eventi-normali">
                <label class="form-label">Pasto partenza</label>
                <select class="form-select" data-field="pasto_partenza">
                    <option value="nessuno">Nessuno</option>
                    <option value="colazione">Colazione</option>
                    <option value="pranzo">Pranzo</option>
                    <option value="prima_colazione">Prima di colazione</option>
                </select>
                <div class="form-text">Fino a quale pasto restate il giorno di partenza (o "Prima di colazione" se partite prima). L'ultimo pasto disponibile è il pranzo dell'ultimo giorno.</div>
            </div>
            <div class="col-md-6 blocco-eventi-normali">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" data-field="flag_bosco_domenica" id="bosco-domenica-CHECK">
                    <label class="form-check-label" for="bosco-domenica-CHECK">
                        Vorrei dormire a Bosco la domenica sera
                    </label>
                </div>
            </div>
            <div class="col-md-6 campo-cena-domenica d-none blocco-eventi-normali">
                <label class="form-label d-block">Cena della domenica</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="cena_domenica" data-field="flag_cena_ristorante_domenica" value="true" id="cena-ristorante-CHECK">
                    <label class="form-check-label" for="cena-ristorante-CHECK">Al ristorante</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="cena_domenica" data-field="flag_cena_ristorante_domenica" value="false" id="cena-autonoma-CHECK">
                    <label class="form-check-label" for="cena-autonoma-CHECK">Mi organizzo autonomamente</label>
                </div>
            </div>
            <div class="col-12 blocco-eventi-normali">
                <div class="alert alert-info d-none msg-bosco-domenica mb-0">
                    Info: se dormi a Bosco la domenica sera viene conteggiata una notte aggiuntiva nel prezzo.
                </div>
            </div>
            <div class="col-12 blocco-pranzo-cun d-none">
                <div class="alert alert-info mb-0">
                    Iscrizione al solo pranzo del CUN: non servono date di arrivo/partenza né pasti,
                    verranno impostati automaticamente in base al giorno del pranzo.
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Note (preferenze stanza, restrizioni alimentari, altre comunicazioni)</label>
                <textarea class="form-control" data-field="note" rows="2"></textarea>
            </div>
        </div>
    </div>
</template>

<script>
    window.PERIODI_EVENTI = {{ periodi_eventi | tojson }};
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='/js/form_iscrizione.js') }}?v=3"></script>
</body>
</html>
